version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    container_name: pizza-postgres
    environment:
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_pass
      POSTGRES_DB: restaurant_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      CONFIG_PATH: /app/configs/config.yaml
    ports:
      - "3000:3000"
    volumes:
      - ./configs:/app/configs
    command: ["/app/wheres-my-pizza", "--mode=order-service", "--port=3000"]
    restart: unless-stopped

  kitchen-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchen-worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      CONFIG_PATH: /app/configs/config.yaml
    volumes:
      - ./configs:/app/configs
    command: ["/app/wheres-my-pizza", "--mode=kitchen-worker", "--worker-name=chef_mario", "--prefetch=1"]
    restart: unless-stopped

  tracking-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracking-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONFIG_PATH: /app/configs/config.yaml
    ports:
      - "3001:3001"
    volumes:
      - ./configs:/app/configs
    command: ["/app/wheres-my-pizza", "--mode=tracking-service", "--port=3001"]
    restart: unless-stopped

  notification-subscriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-subscriber
    depends_on:
      rabbitmq:
        condition: service_started
    environment:
      CONFIG_PATH: /app/configs/config.yaml
    volumes:
      - ./configs:/app/configs
    command: ["/app/wheres-my-pizza", "--mode=notification-subscriber"]
    restart: unless-stopped

volumes:
  postgres_data:
